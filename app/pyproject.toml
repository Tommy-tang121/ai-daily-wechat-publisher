[project]
name = "ai-daily"
version = "2.0.0"
description = "Local AI daily-news publisher"
requires-python = ">=3.14,<3.15"
dependencies = [
  "flask>=3.1,<4",
  "pillow>=12,<13",
  "requests>=2.32,<3",
  "waitress>=3.0,<4",
]

[project.scripts]
ai-daily = "ai_daily.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
